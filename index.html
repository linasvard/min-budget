<!doctype html>
<html lang="sv">
  <head>

    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@100..900&display=swap" rel="stylesheet">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Min Budget.</title>
  </head>
  <body>
    <header>
      <h1><span class="smallHeader">Min </span>Budget<span class="smallHeader2">.</span></h1>
    </header>
    
    <main>
      <section class="budgetFormWrapper">
        <h2 class="inputHeader">Inmatning.</h2>
        <div class="incomeOrExpenseRadioBtns">
          
          <label>
            <span>Inkomst</span>
            <input type="radio" name="incomeOrExpense" value="income" class="income" checked>
          </label>
         
          <label>
            <span>Utgift</span>
            <input type="radio" name="incomeOrExpense" value="expense" class="expense">
          </label>
        </div>
        <div id="income">
          <form id="incomeForm">
            <h2>Inkomst<span class="smallHeader">.</span></h2>
            <div>
              <span>Kategori</span>
              <select name="incomeCategory" id="incomeCategory">
                <option value="" disabled selected>Välj kategori...</option>
                
              </select>
            </div>
            
            <div>
              <span>Summa:</span>
              <input type="text" name="incomeField" placeholder="SEK" class="incomenumber">
            </div>  
            <div>
              <span class="descriptionField">Beskrivning</span>
              <input type="text" name="incomeField" placeholder="Lägg in beskrivning..." class="incomedescription">
            </div>
          </form>
          <button id="addIncomeBtn">Lägg till</button>
        </div>

        <div id="expense" class="hidden">
          <form id="expenseForm">
            <h2>Utgift<span class="smallHeader2">.</span></h2>
            <div class="formWrapper">
              <span>Kategori</span>
              <select name="expenseCategory" id="expenseCategory">
                <option value="" disabled selected>Välj kategori...</option>
              </select>
            </div>
            
            <div>
              <span>Summa:</span>
              <input type="text" name="expenseField" placeholder="SEK" class="expensenumber">
            </div>
            <div>
              <span>Beskrivning</span>
              <input type="text" name="expenseField" placeholder="Lägg in beskrivning..." class="expensedescription">
            </div>
          </form> 
          <button id="addExpenseBtn">Lägg till</button>
        </div>
      </section>
      <section class="totalBalanceWrapper">
        <h2 class="balanceHeader">Balans.</h2>
        <div id="listOfIncomeAndExpenses">
          
        </div>

      </section>
    </main>
    <footer>
      <p>&copy; 2026 <span class="smallHeader">Min</span> Budget<span>.</span></p> <p class="sloganFooter">Håll koll på din ekonomi.</p>
    </footer>

    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
