<!doctype html>
<html lang="sv">
  <head>

    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@100..900&display=swap" rel="stylesheet">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Min Budget.</title>
  </head>
  <body>
    <header>
      <h1><span class="smallHeader">Min </span>Budget<span>.</span></h1>
    </header>
    
    <main>
      <section class="budgetFormWrapper">
        <h1>Inmatning</h1>
        <div class="incomeOrExpenseRadioBtns">
          <!---Val: Inkomst---->
          <label>
            <span>Inkomst</span>
            <input type="radio" name="incomeOrExpense" value="income" class="income">
          </label>
          <!---Val: Utgift---->
          <label>
            <span>Utgift</span>
            <input type="radio" name="incomeOrExpense" value="expense" class="expense">
          </label>
        </div>
        <div id="income" class="hidden">
          <form id="incomeForm">
            
            <div>
              <span>Kategori</span>
              <select name="incomeCategory" id="incomeCategory">
                <option value="">Typ av inkomst</option>
                <option value="salary">Lön</option>
                <option value="grant">Bidrag</option>
                <option value="csn">Studiemedel</option>
                <option value="other">Övrigt</option>
              </select>
            </div>
            <div>
              <span>Beskrivning</span>
              <input type="text" name="incomeField" placeholder="Förtydligande" class="incomedescription">
            </div>
            <div>
              <span>Summa:</span>
              <input type="number" name="incomeField" placeholder="SEK" class="incomenumber">
            </div>  
          </form>
          <button id="addIncomeBtn">Lägg till</button>
        </div>

        <div id="expense" class="hidden">
          <form id="expenseForm">
            <div>
              <span>Kategori</span>
              <select name="expenseCategory" id="expenseCategory">
                <option value="">Typ av utgift</option>
                <option value="food">Mat & dagligvaror</option>
                <option value="transportation">Transport</option>
                <option value="entertainment">Nöje & fritid</option>
                <option value="otherpersonal">Övrigt & personligt</option>
              </select>
            </div>
            <div>
              <span>Beskrivning</span>
              <input type="text" name="expenseField" placeholder="Förtydligande" class="expensedescription">
            </div>
            <div>
              <span>Summa:</span>
              <input type="number" name="expenseField" placeholder="SEK" class="expenseenumber">
            </div>
            
          </form> 
          <button id="addExpenseBtn">Lägg till</button>
        </div>
      </section>
    </main>


    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
