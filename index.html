<!doctype html>
<html lang="sv">
  <head>

    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@100..900&display=swap" rel="stylesheet">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Min Budget.</title>
  </head>
  <body>
    <header>
      <h1><span class="smallHeader">Min </span>Budget<span>.</span></h1>
    </header>
    
    <main>
      <section class="budgetFormWrapper">
        <h1>Inmatning</h1>
        <div class="incomeOrExpenseRadioBtns">
          <!---Val: Inkomst---->
          <label>
            <span>Inkomst</span>
            <input type="radio" name="incomeOrExpense" value="income" class="income">
          </label>
          <!---Val: Utgift---->
          <label>
            <span>Utgift</span>
            <input type="radio" name="incomeOrExpense" value="expense" class="expense">
          </label>
        </div>
        <div id="income" class="hidden">
          <form id="incomeForm">
            <span>Kategori</span>
            <select name="category" id="category">
              <option value="">Typ av inkomst</option>
              <option value="salary">Lön</option>
              <option value="grant">Bidrag</option>
              <option value="csn">Studiemedel</option>
              <option value="other">Annat</option>
            </select>
            <span>Summa:</span>
            <input type="number" name="incomeField" placeholder="SEK" class="incomenumber"> 
          </form>
        </div>

        <div id="expense" class="hidden">
          <form id="expenseForm">
            
          </form>
        </div>
      </section>
    </main>


    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
